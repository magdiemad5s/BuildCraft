# Keep Gradle state project-local by setting GRADLE_USER_HOME to .gradle-user-home
# before running any Gradle task. The daemon is deliberately disabled for this lane.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
# The verification tasks use doLast and are not configuration-cache safe yet.
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-download=false

# Matches the official NeoForge 1.21.1 ModDevGradle template pin.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.242
loader_version_range=[1,)

mod_version=0.1.1-dev
mod_group_id=buildcraft.neo
mod_license=MPL-2.0
