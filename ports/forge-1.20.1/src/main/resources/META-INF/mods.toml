modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MPL-2.0"
showAsResourcePack=false

[[mods]]
    modId="buildcraftlib"
    version="${mod_version}"
    displayName="BuildCraft Neo - Library"
    logoFile="buildcraft_neo_logo.png"
    credits="Special thanks to the original BuildCraft team and all contributors."
    authors="BuildCraft Team, CurativeTree, ShipovskijKorp, magdiemad5s"
    description='''
Shared library code and runtime helpers used by the BuildCraft Neo modules.
    '''
    displayTest="MATCH_VERSION"

[[dependencies.buildcraftlib]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.buildcraftlib]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.buildcraftlib]]
    modId="jei"
    mandatory=false
    versionRange="[15,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.buildcraftlib]]
    modId="jade"
    mandatory=false
    versionRange="[11,)"
    ordering="AFTER"
    side="BOTH"

