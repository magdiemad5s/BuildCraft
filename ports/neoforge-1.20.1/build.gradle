plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    // Pinned from the official NeoForge MDK's documented NeoGradle 7.0 line.
    id 'net.neoforged.gradle.userdev' version '7.0.97'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "buildcraft-neo-better-neoforge-${minecraft_version}"
}

// Minecraft 1.20.1 ships Java 17 to players.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

runs {
    configureEach {
        // Every generated run directory stays in this lane; no live instance is touched.
        workingDirectory project.file("run/${name}")
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', 'buildcraftfactory'
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', 'buildcraftfactory'
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', 'buildcraftfactory'
    }

    data {
        workingDirectory project.file('run-data')
        programArguments.addAll '--mod', 'buildcraftfactory', '--all',
            '--output', file('src/generated/resources/').getAbsolutePath(),
            '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 1.20.1 is a transitional NeoForge release: its published artifact is named forge.
    implementation "net.neoforged:forge:${neoforge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.register('verifyLegacyContract') {
    description = 'Checks the preserved BuildCraft namespace and module-ID contract.'
    group = 'verification'

    def contract = rootProject.file('../../legacy-1.12.2-contract/identity.json')
    inputs.file(contract)

    doLast {
        def parsed = new groovy.json.JsonSlurper().parse(contract)
        def expectedModules = [
            'buildcraftlib', 'buildcraftcore', 'buildcraftbuilders', 'buildcraftenergy',
            'buildcraftfactory', 'buildcraftsilicon', 'buildcrafttransport', 'buildcraftrobotics'
        ]
        if (parsed.resourceNamespace != 'buildcraft') {
            throw new GradleException("Unexpected legacy resource namespace: ${parsed.resourceNamespace}")
        }
        if (parsed.moduleIds != expectedModules) {
            throw new GradleException("Legacy module contract drifted: ${parsed.moduleIds}")
        }
        if (parsed.legacySource.minecraft != '1.12.2') {
            throw new GradleException("Unexpected legacy source version: ${parsed.legacySource.minecraft}")
        }
    }
}

def visualJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyTankVisualResources', Exec) {
    description = 'Verifies Factory Tank legacy visual resources in the source tree and packaged JAR.'
    group = 'verification'
    dependsOn tasks.named('jar')
    inputs.file(visualJar)
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
        file('tools/verify-tank-visuals.ps1').absolutePath, '-JarPath', visualJar.get().asFile.absolutePath
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyLegacyContract')
    dependsOn tasks.named('verifyTankVisualResources')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Implementation-Title': 'BuildCraft Neo Better',
            'Implementation-Version': project.version,
            'BuildCraft-Legacy-Contract': '1.12.2'
        ])
    }
}
